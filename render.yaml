# ======================================================================
# Blueprint de despliegue en Render para BosqueSur ES3.
# Crea: PostgreSQL + API (Node) + Web (estática).
# Nota: en el plan gratuito puede haber "cold start" (ver docs/PRUEBAS_Y_EVIDENCIAS.md).
# Ajusta las URLs (CORS_ORIGINS y VITE_API_URL) según los dominios reales que
# Render asigne a cada servicio.
# ======================================================================

databases:
  - name: bosquesur-db
    databaseName: bosquesur_es3
    user: bosquesur
    plan: free

services:
  # ---------------------- API REST ----------------------
  - type: web
    name: bosquesur-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    # Aplica migraciones y luego inicia la API.
    startCommand: npm run db:migrate -w apps/api && npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bosquesur-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: NODE_VERSION
        value: 22.18.0
      - key: NODE_ENV
        value: production
      - key: PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING
        value: "1"
      # Debe coincidir con el dominio de la web desplegada.
      - key: CORS_ORIGINS
        value: https://bosquesur-web.onrender.com

  # ---------------------- Web (estática) ----------------------
  - type: web
    name: bosquesur-web
    runtime: static
    buildCommand: npm install && npm run build:web
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      # Debe apuntar a la API desplegada.
      - key: VITE_API_URL
        value: https://bosquesur-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
